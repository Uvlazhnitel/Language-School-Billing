name: Publish web release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: uvlazhnitel/language-school-billing

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test Go packages
        run: go test ./...

      - name: Build web server
        run: go build -o /tmp/langschool-web ./cmd/web

      - name: Build Docker image
        run: docker build --tag langschool:release-check .

  publish:
    name: Publish Docker image and GitHub Release
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Validate release tag
        env:
          GENERATED_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [[ -z "$GENERATED_TAGS" ]]; then
            echo "The release tag is not valid semantic versioning." >&2
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          version="${RELEASE_TAG#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          notes_file="${RUNNER_TEMP}/release-notes.md"
          payload_file="${RUNNER_TEMP}/release-payload.json"
          cat >"$notes_file" <<EOF
          Web-only LangSchool release.

          Docker image: \`${RELEASE_IMAGE}:${version}\`

          \`\`\`bash
          docker pull ${RELEASE_IMAGE}:${version}
          docker run -d --name langschool --restart unless-stopped -p 8082:8080 --env-file .env \\
            -v langschool-data:/var/lib/langschool/data \\
            -v langschool-invoices:/var/lib/langschool/invoices \\
            -v langschool-backups:/var/lib/langschool/backups \\
            ${RELEASE_IMAGE}:${version}
          \`\`\`
          EOF

          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg name "LangSchool $RELEASE_TAG" \
            --rawfile body "$notes_file" \
            --argjson prerelease "$prerelease" \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: $prerelease}' \
            >"$payload_file"

          if release_id="$(gh api "repos/${RELEASE_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .id 2>/dev/null)"; then
            gh api --method PATCH "repos/${RELEASE_REPOSITORY}/releases/${release_id}" --input "$payload_file" >/dev/null
          else
            gh api --method POST "repos/${RELEASE_REPOSITORY}/releases" --input "$payload_file" >/dev/null
          fi
